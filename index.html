<!DOCTYPE html>
<html lang="kmr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Shell & Bot Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/css/xterm.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.min.js"></script>
    <style>
        body { background-color: #0d1117; color: #fff; margin: 0; padding: 20px; font-family: monospace; }
        .header { text-align: center; margin-bottom: 15px; color: #58a6ff; }
        #terminal-container { width: 100%; height: 80vh; background: #000; padding: 10px; border-radius: 8px; border: 1px solid #30363d; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🚀 VIP Shell & Telegram Bot Terminal</h2>
    </div>
    <div id="terminal-container"></div>

    <script>
        const term = new Terminal({ cursorBlink: true, theme: { background: '#000000' } });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        term.writeln('\x1b[1;32m[VIP System] Terminal is ready. Type your commands below...\x1b[0m\n');

        let currentInput = '';
        term.onData(e => {
            if (e === '\r') { // Enter key
                term.write('\r\n');
                if (currentInput.trim().length > 0) {
                    term.writeln(`\x1b[1;34m[Executing]:\x1b[0m ${currentInput}`);
                    // لێرەدا فەرمان بۆ بەشێ پشتێ (Backend) دهێتە ناردن
                }
                term.write('$ ');
                currentInput = '';
            } else if (e === '\u007F') { // Backspace
                if (currentInput.length > 0) {
                    currentInput = currentInput.slice(0, -1);
                    term.write('\b \b');
                }
            } else {
                currentInput += e;
                term.write(e);
            }
        });
        term.write('$ ');
    </script>
</body>
</html>
