<!DOCTYPE html>
<html lang="kmr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FULL VIP SHELL TERMINAL</title>
    <!-- Xterm.js CSS and Scripts -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.1.0/css/xterm.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.1.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.7.0/lib/xterm-addon-fit.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0d1117;
            color: #00ff66;
            margin: 0;
            padding: 15px;
            font-family: 'Courier New', Courier, monospace;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
            padding: 12px;
            background: #161b22;
            border-radius: 8px;
            border: 1px solid #30363d;
        }
        .header h2 {
            margin: 0;
            color: #58a6ff;
            font-size: 20px;
            letter-spacing: 1px;
        }
        .status {
            color: #8b949e;
            font-size: 13px;
            margin-top: 5px;
        }
        #terminal-container {
            width: 100%;
            height: 78vh;
            background: #000000;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #30363d;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>⚡ FULL VIP SHELL & BOT MANAGER ⚡</h2>
        <div class="status" id="status">پەیوەندیکرن ب سەرڤەری...</div>
    </div>

    <div id="terminal-container"></div>

    <script>
        // Terminal setup
        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            fontFamily: 'monospace',
            theme: {
                background: '#000000',
                foreground: '#00ff66',
                cursor: '#00ff66'
            }
        });

        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        window.addEventListener('resize', () => fitAddon.fit());

        // Auto WebSocket Connection
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const wsUrl = `${protocol}//${window.location.host}`;
        const socket = new WebSocket(wsUrl);

        const statusEl = document.getElementById('status');

        socket.onopen = () => {
            statusEl.innerHTML = '<span style="color:#2ea043; font-weight: bold;">● Connected (VIP Server Online)</span>';
        };

        socket.onmessage = (event) => {
            term.write(event.data);
        };

        socket.onclose = () => {
            statusEl.innerHTML = '<span style="color:#f85149; font-weight: bold;">● Disconnected</span>';
            term.writeln('\r\n\x1b[1;31m[Disconnected from VIP Server]\x1b[0m');
        };

        let inputBuffer = '';

        term.onData(data => {
            if (data === '\r') { // Enter
                socket.send(inputBuffer);
                inputBuffer = '';
            } else if (data === '\u007F') { // Backspace
                if (inputBuffer.length > 0) {
                    inputBuffer = inputBuffer.slice(0, -1);
                    term.write('\b \b');
                }
            } else {
                inputBuffer += data;
                term.write(data);
            }
        });
    </script>
</body>
</html>
