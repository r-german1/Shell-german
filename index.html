<!DOCTYPE html>
<html lang="kmr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free VIP VPS & Telegram Bot Host</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #fff; font-family: sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; color: #fff; }
        .btn-vip { background-color: #38bdf8; color: #0f172a; font-weight: bold; }
    </style>
</head>
<body class="d-flex align-items-center min-vh-100">
    <div class="container text-center">
        <h1 class="mb-4 text-info">Free VIP Cloud Server & Bot Host</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-lg">
                    <h3>داخوازکرنا VPS / بۆتێ خۆڕایی</h3>
                    <form id="hostForm">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="username" placeholder="ناڤێ بەکارهێنەری" required>
                        </div>
                        <div class="mb-3">
                            <select class="form-select" id="serviceType">
                                <option value="vps">Linux VPS (1 vCPU, 2GB RAM)</option>
                                <option value="bot">Telegram Bot Hosting (Python/Node.js)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-vip w-100">دروستکرن (Free VIP)</button>
                    </form>
                    <div id="result" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
